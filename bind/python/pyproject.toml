[project]
name = "phi_save_codec"
version = "0.4.0"
description = "Phigros Cloud Save Codec Library"
authors = [
    {name = "PhigrosLabs", email = "admin@phigros-labs.dev"},
]
dependencies = ["wasmtime>=41.0.0", "msgpack>=1.1.2"]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
pre_build = "python scripts/copy_wasm.py"