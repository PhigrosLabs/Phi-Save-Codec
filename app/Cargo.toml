[package]
name = "phi_save_codec"
version = "0.4.0"
edition = "2024"
authors = ["PhigrosLabs <admin@phigros-labs.dev>"]
license = "MIT"
repository = "https://github.com/PhigrosLabs/Phi-Save-Codec"
description = "Phigros Cloud Save Codec Library"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive","alloc"] }
serde-tuple-vec-map = { version = "1", default-features = false }

[dev-dependencies]
serde_json = "1"
aes = "0.8.4"
cbc = "0.1.2"